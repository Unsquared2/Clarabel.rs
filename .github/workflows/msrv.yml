name: MSRV default features build test (1.70)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

env: 
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Default features with rustc ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - 1.70.0
          - stable
          - beta
    steps:
      - uses: actions/checkout@v4
      # Resolve dependencies to versions compatible with rust-version
      # (old cargo cannot do this itself), then build with the toolchain
      - run: rustup update stable && CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose
      - run: cargo test --verbose
